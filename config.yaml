# RAGSelfTrain configuration (as actually built)
# Env: HF_ENDPOINT=https://hf-mirror.com  KIMI_API_KEY=...

corpus:
  source: "zhaosuifeng/FinRAGBench-V"        # EMNLP 2025, apache-2.0, Chinese financial PDFs
  pdfs_dir: "corpus/pdfs_selected_for_queries"  # 373 PDFs extracted from pdfs_for_QA tarball
  used_docs: 193                                # docs needed by the 720 matched benchmark queries

parsing:
  text_pages: "pymupdf"                        # page-level text via pymupdf (digital-born pages)
  image_pages: "mineru-ocr"                    # ~130 query-referenced image-only pages OCR'd via MinerU

retrieval:
  bm25: { tokenizer: "char_bigram", k1: 1.5, b: 0.75 }
  dense: { model: "BAAI/bge-base-zh-v1.5", dim: 768 }
  rrf: { k: 60 }
  rerank: { top_k_retrieve: 50, top_k_final: 10, max_len: 512 }

models:
  bi_encoder_pretrained: "BAAI/bge-base-zh-v1.5"     # 110M
  bi_encoder_finetuned: "checkpoints/biencoder"      # InfoNCE, 3 epochs (release: rag_artifacts.tar.gz)
  reranker_pretrained: "BAAI/bge-reranker-base"      # 278M
  reranker_finetuned: "checkpoints/reranker_v2"      # BCE, 2 epochs, same-doc+cross-doc+self-mined negatives
  query_instruction: "为这个句子生成表示以用于检索相关文章："  # query-only, identical train/inference

training:
  triples: "data/train_triples_v2.jsonl"       # 618 (query, gold page, hard negatives), from benchmark qrels
  golden: "data/golden.jsonl"                  # 99 real benchmark queries, doc-level held out
  bi_encoder:  { epochs: 3, lr: 1e-5, batch_size: 32 }
  reranker:    { epochs: 2, lr: 5e-6, batch_size: 16 }

eval:
  n_golden: 99
  rows: ["bm25", "off_dense_rrf", "off_full_rerank", "trained_dense_rrf", "trained_full_rerank"]
  metrics: ["Recall@10", "nDCG@10", "MRR@10"]  # single-gold qrels → Recall@10 = Hit@10
  significance: "paired bootstrap 95% CI + Wilcoxon (results/stats_summary.md)"
  output: "results/"
  seed: 42
