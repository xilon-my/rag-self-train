[project]
name = "rag-self-train"
version = "0.1.0"
description = "RAGSelfTrain: from-first-principles retrieval + self-trained bi-encoder & reranker on multimodal financial PDFs (FinRAGBench-V), measured with paired bootstrap CIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "accelerate>=0.33",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "numpy>=1.26,<2",  # torch 2.7 nightly is compiled against numpy 1.x; 2.x breaks tensor.numpy()
    "PyMuPDF>=1.23",   # pymupdf: page-level text + page-image rendering
    "scipy>=1.10",     # wilcoxon signed-rank
    "typer>=0.12",
    "gradio>=4.0",
]

[project.optional-dependencies]
# MinerU (magic-pdf) only for OCR-ing query-referenced image-only pages; heavy, optional.
mineru = ["magic-pdf[full]>=1.3.12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
