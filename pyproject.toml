[project]
name = "rag-self-train"
version = "0.1.0"
description = "RAGSelfTrain: from-first-principles retrieval + self-trained bi-encoder & reranker on multimodal financial PDFs, evaluated with ragas + RAGChecker."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "accelerate>=0.33",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "numpy>=1.26,<2",  # torch 2.7 nightly was compiled against numpy 1.x; 2.x breaks tensor.numpy()
    "typer>=0.12",
    "gradio>=4.0",
    "ragas>=0.2",
]

[project.optional-dependencies]
# PDF parsing: Docling (MIT, easy install) replaces MinerU (dependency-heavy,
# version-mismatched model set). TableFormer is strong on financial tables.
parsing = ["docling>=2.0"]
ragchecker = ["ragchecker>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
